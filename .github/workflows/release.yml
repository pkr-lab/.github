name: Release (wiederverwendbar)

on:
  workflow_call:
    inputs:
      branches:
        description: "JSON-Liste der Release-Branches"
        type: string
        default: '["main"]'
      build-script:
        description: "Skript im Repo, das Artefakte nach dist/ baut; bekommt die neue Version als Argument"
        type: string
        default: ""
      assets:
        description: "JSON-Liste der Glob-Muster, die ans GitHub-Release angehängt werden"
        type: string
        default: "[]"
      image:
        description: "Name des Container-Images unter ghcr.io/<owner>/, leer = kein Image"
        type: string
        default: ""
      changelog:
        description: "CHANGELOG.md pflegen und als Release-Commit auf den Branch pushen; false bei Branches, die nur per Pull Request änderbar sind"
        type: boolean
        default: true
      node-version:
        description: "Node.js-Version für npx"
        type: string
        default: "24"
    outputs:
      released:
        description: "true, wenn ein neues Release entstanden ist"
        value: ${{ jobs.release.outputs.released }}
      version:
        description: "Neue Version ohne v, leer ohne Release"
        value: ${{ jobs.release.outputs.version }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: semantic-release konfigurieren
        env:
          BRANCHES: ${{ inputs.branches }}
          BUILD_SCRIPT: ${{ inputs.build-script }}
          ASSETS: ${{ inputs.assets }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          for file in .releaserc .releaserc.json .releaserc.yaml .releaserc.yml .releaserc.js .releaserc.cjs .releaserc.mjs release.config.js release.config.cjs release.config.mjs; do
            if [ -e "$file" ]; then
              echo "::warning file=$file::Das Repo hat eine eigene Release-Konfiguration; der zentrale Workflow ersetzt sie durch .releaserc.json."
            fi
          done
          if [ -f package.json ] && node -e 'process.exit(require("./package.json").release ? 0 : 1)'; then
            echo "::warning file=package.json::package.json enthält einen release-Abschnitt; der zentrale Workflow ersetzt ihn durch .releaserc.json."
          fi
          cat > "$RUNNER_TEMP/configure.cjs" <<'NODE'
          const fs = require("fs");
          const preset = { preset: "conventionalcommits" };
          const changelogFile = "CHANGELOG.md";
          const patchSections = { docs: "Documentation", chore: "Chores" };
          const patchTypes = Object.keys(patchSections);
          const plugins = [
            ["@semantic-release/commit-analyzer", { ...preset, releaseRules: patchTypes.map((type) => ({ type, release: "patch" })) }],
            ["@semantic-release/release-notes-generator", {
              ...preset,
              presetConfig: { types: [
                { type: "feat", section: "Features" },
                { type: "fix", section: "Bug Fixes" },
                { type: "perf", section: "Performance Improvements" },
                { type: "revert", section: "Reverts" },
                ...patchTypes.map((type) => ({ type, section: patchSections[type] })),
              ] },
            }],
          ];
          if (process.env.CHANGELOG === "true") {
            plugins.push(["@semantic-release/changelog", { changelogFile }]);
          }
          if (process.env.BUILD_SCRIPT) {
            const script = "'" + process.env.BUILD_SCRIPT.replace(/'/g, "'\\''") + "'";
            plugins.push(["@semantic-release/exec", { prepareCmd: "bash " + script + " ${nextRelease.version}" }]);
          }
          if (process.env.CHANGELOG === "true") {
            plugins.push([
              "@semantic-release/git",
              { assets: [changelogFile], message: "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}" },
            ]);
          }
          const assets = JSON.parse(process.env.ASSETS || "[]");
          plugins.push(["@semantic-release/github", assets.length ? { assets } : {}]);
          const config = { branches: JSON.parse(process.env.BRANCHES), tagFormat: "v${version}", plugins };
          fs.writeFileSync(".releaserc.json", JSON.stringify(config, null, 2));
          NODE
          node "$RUNNER_TEMP/configure.cjs"

      - name: Vorhandene Tags merken
        run: git tag -l > "$RUNNER_TEMP/tags-before"

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          npx --yes
          -p semantic-release
          -p @semantic-release/changelog
          -p @semantic-release/git
          -p @semantic-release/exec
          -p conventional-changelog-conventionalcommits@8
          semantic-release

      - name: Release-Tag ermitteln
        id: version
        run: |
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF -f "$RUNNER_TEMP/tags-before" | sort -V | tail -n1 || true)
          if [ -n "$tag" ]; then
            {
              echo "released=true"
              echo "version=${tag#v}"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "released=false"
              echo "version="
              echo "tag="
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Image bauen und veröffentlichen
        if: steps.version.outputs.released == 'true' && inputs.image != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          IMAGE: ${{ inputs.image }}
        run: |
          rm -f .releaserc.json
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            -t "${ref}:${TAG}" .
          docker push "${ref}:${TAG}"
