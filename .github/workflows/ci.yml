name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  hook:
    name: commit-msg-Hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gültige und ungültige Nachrichten
        run: |
          check() {
            printf '%s\n' "$1" > "$RUNNER_TEMP/msg"
            if hooks/commit-msg "$RUNNER_TEMP/msg" 2>/dev/null; then got=ok; else got=fail; fi
            if [ "$got" != "$2" ]; then
              echo "::error::'$1': erwartet $2, erhalten $got"
              return 1
            fi
          }
          check "feat(app): Neu" ok
          check "fix!: Bruch" ok
          check "chore(release): 1.0.0 [skip ci]" ok
          check "Update README" fail
          check "feat ohne Doppelpunkt" fail
          check "feat: Ende mit Punkt." fail
          check "feat(App): Großer Scope" fail
          check "feat: $(printf 'x%.0s' {1..115})" fail
          check "feat: $(printf 'x%.0s' {1..114})" ok
          check "Merge branch 'main' into feat/x" ok
          check "fixup! feat: Nachtrag." ok

  commitlint-rules:
    name: commitlint-Regeln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Hook und commitlint bewerten gleich
        run: |
          sed -n "/<<'NODE'/,/^ *NODE$/p" .github/workflows/commitlint.yml | sed '1d;$d;s/^          //' > "$RUNNER_TEMP/commitlint.config.cjs"
          check() {
            printf '%s\n' "$1" > "$RUNNER_TEMP/msg"
            if hooks/commit-msg "$RUNNER_TEMP/msg" 2>/dev/null; then hook=ok; else hook=fail; fi
            if npx --yes -p @commitlint/cli@21.2.4 commitlint --config "$RUNNER_TEMP/commitlint.config.cjs" < "$RUNNER_TEMP/msg" >/dev/null 2>&1; then lint=ok; else lint=fail; fi
            if [ "$hook" != "$2" ] || [ "$lint" != "$2" ]; then
              echo "::error::'$1': erwartet $2, Hook $hook, commitlint $lint"
              return 1
            fi
          }
          check "feat(app): Neu" ok
          check "fix!: Bruch" ok
          check "feat(app)!: Bruch mit Scope" ok
          check "chore(release): 1.0.0 [skip ci]" ok
          check "Update README" fail
          check "feat: Ende mit Punkt." fail
          check "feat(App): Großer Scope" fail
          check "unbekannt: Typ" fail
          check "feat: $(printf 'x%.0s' {1..115})" fail

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
